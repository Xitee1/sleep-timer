name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify release metadata matches tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "${VER%%-*}"   # strip any -suffix, matching versionCodeFrom
          CODE=$((MA * 100000 + MI * 1000 + PA * 10))
          grep -qx "versionName=$VER"  app/version.properties
          grep -qx "versionCode=$CODE" app/version.properties
          for LOCALE in en-US de-DE; do
            FILE="fastlane/metadata/android/$LOCALE/changelogs/$CODE.txt"
            test -f "$FILE" || { echo "Missing F-Droid changelog: $FILE"; exit 1; }
            test "$(wc -c < "$FILE")" -le 500 || { echo "Changelog over 500 chars: $FILE"; exit 1; }
          done

      - name: Decode release keystore
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/release.keystore"

      - name: Build release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version tag
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk "artifacts/SleepTimer-${{ github.ref_name }}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepTimer-${{ github.ref_name }}
          path: artifacts/SleepTimer-${{ github.ref_name }}.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/SleepTimer-${{ github.ref_name }}.apk
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
